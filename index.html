<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard Controller</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { 
      margin-bottom: 10px; 
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .team {
      /* margin-bottom: 20px; */
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      max-width: 250px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
    .timer-controls {
      /* margin-top: 20px; */
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      max-width: 250px;
    }
    .value {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .controls{
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
    <div style="width: 30vw; height: 30vh; overflow: hidden; border: 1px solid #ccc; background: black;">
        <iframe id="scoreboard-preview" src="scoreboard.html" style="width: 100vw; height: 100vh; border: 0; display: block; transform: scale(0.3); transform-origin: 0 0;"></iframe>
    </div>
  
    <div class="controls">
        <div class="team">
            <!-- <h1>Left team</h1> -->
            <div class="value">Score: <span id="team-left-score">0</span></div>
            <div class="value">Fouls: <span id="team-left-fouls">0</span></div>
            <button onclick="sendCommand('incScore', 'team-left')">+ Score</button>
            <button onclick="sendCommand('decScore', 'team-left')">- Score</button>
            <button onclick="sendCommand('incFoul', 'team-left')">+ Foul</button>
            <button onclick="sendCommand('decFoul', 'team-left')">- Foul</button>
        </div>
        
        <div class="timer-controls">
            <h1>Timer</h1>
            <div class="value">Time: <span id="timer">20:00</span></div>
            <div style="margin: 10px 0px; ">
                <label for="timer-minutes">Min</label>
                <input type="number" id="timer-minutes" value="20" min="0" max="59" style="width: 40px; margin-right: 10px;">
                <label for="timer-seconds">Sec</label>
                <input type="number" id="timer-seconds" value="0" min="0" max="59" style="width: 40px; margin-right: 10px;">
                <button onclick="setTimerDuration()">Set Duration</button>  
            </div>
            <button id="toggle-timer" onclick="toggleTimer()">Start</button>
            <button onclick="sendCommand('resetTimer')">Reset</button>
        </div>

        <div class="team">
          <!-- <h1>Right team </h1>   -->
          
            <div class="value">Score: <span id="team-right-score">0</span></div>
            <div class="value">Fouls: <span id="team-right-fouls">0</span></div>
            <button onclick="sendCommand('incScore', 'team-right')">+ Score</button>
            <button onclick="sendCommand('decScore', 'team-right')">- Score</button>
            <button onclick="sendCommand('incFoul', 'team-right')">+ Foul</button>
            <button onclick="sendCommand('decFoul', 'team-right')">- Foul</button>
        </div>

    </div>

  <div style="margin: 20px 0; text-align: center;">
    <button onclick="sendCommand('switchSides')">Switch Sides</button>

  </div>

  <script type="module" src="client.js"></script>
</body>
</html>
