<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard Controller</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { 
      margin-bottom: 10px; 
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .team {
      /* margin-bottom: 20px; */
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      max-width: 250px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
    .timer-controls {
      /* margin-top: 20px; */
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      max-width: 250px;
    }
    .value {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .team-select {
      margin-bottom: 10px;
      max-width: 100%;
      padding: 5px;
    }
    .controls{
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
    #timer-status-border {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      border: 8px solid red;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 9999;
    }
    #timer-status-border.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
    <div id="timer-status-border" aria-hidden="true"></div>
    <a href="scoreboard_fans.html" target="_blank" rel="noopener" aria-label="Open scoreboard in a new tab" title="Open scoreboard in a new tab" style="display: block; width: 30vw; height: 30vh; overflow: hidden; border: 1px solid #ccc; background: black;">
        <iframe id="scoreboard-preview" src="scoreboard.html" tabindex="-1" aria-hidden="true" style="width: 100vw; height: 100vh; border: 0; display: block; transform: scale(0.3); transform-origin: 0 0; pointer-events: none;"></iframe>
    </a>
  
    <div class="controls">
        <div class="team">
            <!-- <label for="team-left-select">Left team</label> -->
            <select class="value" id="team-left-select" onchange="selectTeam('team-left', this.value)">
                <option value="riverdale">Riverdale FC</option>
                <option value="grizzlies">Grizzlies FC</option>
                <option value="northOf60">North of 60</option>
                <option value="latinLovers">Latin Lovers</option>
                <option value="porcupine">Porcupine FC</option>
                <option value="goodVibes">Good Vibes FC</option>
            </select>
            <div class="value">Score: <span id="team-left-score">0</span></div>
            <div class="value">Fouls: <span id="team-left-fouls">0</span></div>
            <button onclick="sendCommand('incScore', 'team-left')">+ Score</button>
            <button onclick="sendCommand('decScore', 'team-left')">- Score</button>
            <button onclick="sendCommand('incFoul', 'team-left')">+ Foul</button>
            <button onclick="sendCommand('decFoul', 'team-left')">- Foul</button>
        </div>
        
        <div class="timer-controls">
            <h1>Timer</h1>
            <div class="value">Time: <span id="timer">20:00</span></div>
            <div style="margin: 10px 0px; ">
                <label for="timer-minutes">Min</label>
                <input type="number" id="timer-minutes" value="20" min="0" max="59" style="width: 40px; margin-right: 10px;">
                <label for="timer-seconds">Sec</label>
                <input type="number" id="timer-seconds" value="0" min="0" max="59" style="width: 40px; margin-right: 10px;">
                <button onclick="setTimerDuration()">Set Duration</button>  
            </div>
            <!-- <button id="toggle-timer" onclick="toggleTimer()">Start</button> -->
            <button id="toggle-timer" onclick="sendCommand('toggleTimer')">Start</button>
            <button onclick="sendCommand('resetTimer')">Reset</button>
        </div>

        <div class="team">
            <!-- <label for="team-right-select">Right team</label> -->
            <select class="value" id="team-right-select" onchange="selectTeam('team-right', this.value)">
                <option value="riverdale">Riverdale FC</option>
                <option value="grizzlies">Grizzlies FC</option>
                <option value="northOf60">North of 60</option>
                <option value="latinLovers">Latin Lovers</option>
                <option value="porcupine">Porcupine FC</option>
                <option value="goodVibes">Good Vibes FC</option>
            </select>
            <div class="value">Score: <span id="team-right-score">0</span></div>
            <div class="value">Fouls: <span id="team-right-fouls">0</span></div>
            <button onclick="sendCommand('incScore', 'team-right')">+ Score</button>
            <button onclick="sendCommand('decScore', 'team-right')">- Score</button>
            <button onclick="sendCommand('incFoul', 'team-right')">+ Foul</button>
            <button onclick="sendCommand('decFoul', 'team-right')">- Foul</button>
        </div>

    </div>

  <div style="margin: 20px 0; text-align: center;">
    <button onclick="sendCommand('switchSides')">Switch Sides</button>

  </div>

  <audio id="buzzer" src="buzzer.mp3" preload="auto"></audio>
  <audio id="no_sound" src="no_sound.mp3" preload="auto"></audio>
  <script type="module" src="client.js"></script>
</body>
</html>
